name: Release

on:
  push:
    branches:
      - 1.x
      - 2.x
      - 3.x

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          release-type: simple
          token: ${{ secrets.PRIVATE_TOKEN }}
